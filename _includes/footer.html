<footer class="site-footer" id="contact">
  <div class="wrap site-footer__inner">
    <div class="site-footer__col">
      <p class="eyebrow">00:00 — GET IN TOUCH</p>
      <h2 class="site-footer__headline">Let's make something.</h2>
      <p class="site-footer__text">
        Based in Juneau, available for projects around Southeast Alaska
        and beyond. Reach out to talk about your next shoot.
      </p>
      <a class="site-footer__email" href="mailto:{{ site.email }}">{{ site.email }}</a>
    </div>
    <div class="site-footer__col site-footer__meta">
      <p class="eyebrow">Location</p>
      <p>{{ site.location }}</p>
      <p class="eyebrow">Follow</p>
      <p>
        <a href="#">Instagram</a><br>
        <a href="#">Vimeo</a>
      </p>
    </div>
  </div>
  <div class="wrap site-footer__bottom">
    <span>&copy; {{ 'now' | date: "%Y" }} Morely Media</span>
  </div>
</footer>
